# Manual SSL proxy for n8n (serves HTTPS via custom cert)
map $scheme $hsts_header {
    https   "max-age=63072000; preload";
}
server {
  set $forward_scheme http;
  set $server         "n8n";
  set $port           5678;

  listen 443 ssl http2;
  listen [::]:443 ssl http2;

  server_name win-9u9o-wsl.ainu-newton.ts.net n8n.local 127.0.0.1;

  include conf.d/include/ssl-ciphers.conf;
  include conf.d/include/ssl-cache.conf;

  ssl_certificate /data/custom_ssl/npm-2/fullchain.pem;
  ssl_certificate_key /data/custom_ssl/npm-2/privkey.pem;

  include conf.d/include/block-exploits.conf;

  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $http_connection;
  proxy_http_version 1.1;

  access_log /data/logs/proxy-host-7_ssl_access.log proxy;
  error_log /data/logs/proxy-host-7_ssl_error.log warn;

  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  location / {
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;
    proxy_http_version 1.1;
    # Force upstream to plain HTTP to avoid SSL handshake to backend
    proxy_pass http://n8n:5678$request_uri;
  }

  include /data/nginx/custom/server_proxy[.]conf;
}
